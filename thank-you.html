<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terima Kasih</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255,255,255,.15);
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: .95rem; opacity: .85; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 12px;
      background: #fff;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      font-size: .9rem;
      transition: transform .2s;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fas fa-paper-plane"></i></div>
    <h1>Pesan Terkirim!</h1>
    <p>Terima kasih sudah menghubungi saya. Pesan Anda akan saya baca dan balas secepatnya.</p>
    <a href="/">Kembali ke Beranda</a>
  </div>
</body>
</html>
